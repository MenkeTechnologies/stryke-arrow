[package]
name = "stryke-arrow-helper"
version = "0.1.0"
edition = "2021"
description = "Apache Arrow / Parquet / IPC / CSV / JSON bridge binary for the stryke `arrow` package."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-arrow"
publish = false

[[bin]]
name = "stryke-arrow-helper"
path = "src/main.rs"

[dependencies]
arrow = "58"
arrow-csv = "58"
arrow-ipc = "58"
arrow-json = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = [
    "arrow",
    "snap",
    "brotli",
    "flate2",
    "flate2-rust_backened",
    "lz4",
    "zstd",
    "base64",
] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
