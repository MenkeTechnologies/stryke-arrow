[package]
name = "stryke-arrow"
version = "0.4.0"
edition = "2021"
description = "Apache Arrow / Parquet / IPC / CSV / JSON cdylib for the stryke `arrow` package — dlopened in-process via stryke's FFI bridge"
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-arrow"
homepage = "https://menketechnologies.github.io/stryke-arrow/"
publish = false

[lib]
name = "stryke_arrow"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
arrow = "58"
arrow-csv = "58"
arrow-ipc = "58"
arrow-json = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = [
    "arrow",
    "snap",
    "brotli",
    "flate2",
    "flate2-rust_backened",
    "lz4",
    "zstd",
    "base64",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
