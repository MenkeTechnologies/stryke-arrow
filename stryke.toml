[package]
name = "stryke-arrow"
version = "0.4.0"
description = "Apache Arrow / Parquet / IPC / Feather / CSV / JSON cdylib for stryke. Dlopened in-process via stryke's FFI bridge — replaces the v1 helper-binary fork-per-call model."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-arrow"
edition = "2026"

[ffi]
lib-name = "stryke_arrow"
namespace = "Arrow"
exports = [
    "arrow__version",
    "arrow__read",
    "arrow__read_columnar",
    "arrow__schema",
    "arrow__stats",
    "arrow__write",
    "arrow__convert",
    "arrow__filter",
    "arrow__select",
    "arrow__sort",
    "arrow__slice",
    "arrow__head",
    "arrow__tail",
    "arrow__count",
    "arrow__concat",
    "arrow__rename",
    "arrow__cast",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
