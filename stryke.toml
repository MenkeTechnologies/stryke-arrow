[package]
name = "stryke-arrow"
version = "0.19.0"
description = "Apache Arrow / Parquet / IPC / Feather / CSV / JSON cdylib for stryke. Dlopened in-process via stryke's FFI bridge — replaces the v1 helper-binary fork-per-call model."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-arrow"
edition = "2026"

[ffi]
lib-name = "stryke_arrow"
namespace = "Arrow"
exports = [
    "arrow__version",
    "arrow__read",
    "arrow__read_columnar",
    "arrow__schema",
    "arrow__stats",
    "arrow__write",
    "arrow__convert",
    "arrow__filter",
    "arrow__filter_in",
    "arrow__filter_not_in",
    "arrow__select",
    "arrow__drop",
    "arrow__distinct",
    "arrow__drop_nulls",
    "arrow__keep_nulls",
    "arrow__fill_null",
    "arrow__sort",
    "arrow__reverse",
    "arrow__gather",
    "arrow__top_k",
    "arrow__value_counts",
    "arrow__slice",
    "arrow__head",
    "arrow__tail",
    "arrow__with_row_index",
    "arrow__count",
    "arrow__null_counts",
    "arrow__shape",
    "arrow__concat",
    "arrow__hstack",
    "arrow__rename",
    "arrow__cast",
    "arrow__sum",
    "arrow__mean",
    "arrow__min_max",
    "arrow__describe",
    "arrow__aggregate",
    "arrow__unique",
    "arrow__clip",
    "arrow__scale",
    "arrow__add_column",
    "arrow__sample",
    "arrow__fold_case",
    "arrow__metadata",
    "arrow__std",
    "arrow__median",
    "arrow__quantile",
    "arrow__corr",
    "arrow__abs",
    "arrow__round",
    "arrow__add_const",
    "arrow__filter_str",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
